<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<meta name="robots" content="noindex, nofollow" />
<title>Vision · Beta Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#070810;--ink:#eef1f8;--muted:#8b93a9;--glass:rgba(20,24,36,.6);--stroke:rgba(255,255,255,.09);
    --stroke-2:rgba(255,255,255,.16);--accent:#5b8bff;--accent-2:#7c5cff;--good:#39d98a;--warn:#ffcc4d;--bad:#ff6a6a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 20px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:18px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 14px var(--accent)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    padding:4px 9px;border:1px solid var(--stroke);border-radius:999px}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#fff;
    padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 24px -12px var(--accent)}
  .btn.ghost{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--stroke-2)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
  input,select{font-family:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--stroke-2);border-radius:11px;padding:10px 12px;outline:none}
  input::placeholder{color:var(--muted)}
  /* auth */
  #auth{max-width:400px;margin:12vh auto;padding:32px;text-align:center}
  #auth h1{font-size:22px;margin:0 0 6px}
  #auth p{color:var(--muted);font-size:14px;margin:0 0 20px}
  #auth input{width:100%;margin-bottom:10px}
  #auth .btn{width:100%}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  /* summary tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .tile{padding:16px 18px}
  .tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
  .tile .v.bad{color:var(--bad)} .tile .v.good{color:var(--good)} .tile .v.warn{color:var(--warn)}
  /* controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .controls .spacer{flex:1}
  /* table */
  .tblwrap{overflow:auto;border-radius:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#10131f;text-align:left;padding:11px 12px;color:var(--muted);
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;border-bottom:1px solid var(--stroke)}
  td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
  tr.row{cursor:pointer;transition:background .15s}
  tr.row:hover{background:rgba(255,255,255,.04)}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-completed{background:rgba(57,217,138,.15);color:var(--good)}
  .b-in_progress{background:rgba(91,139,255,.15);color:var(--accent)}
  .b-assigned{background:rgba(255,255,255,.08);color:var(--muted)}
  .b-abandoned{background:rgba(255,204,77,.15);color:var(--warn)}
  .b-failed{background:rgba(255,106,106,.15);color:var(--bad)}
  .lbl{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
  .lbl-false_accept{background:rgba(255,106,106,.18);color:var(--bad)}
  .lbl-false_reject{background:rgba(255,204,77,.18);color:var(--warn)}
  .lbl-valid{background:rgba(57,217,138,.18);color:var(--good)}
  .lbl-invalid{background:rgba(255,255,255,.1);color:var(--muted)}
  /* drawer */
  #drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;backdrop-filter:blur(4px)}
  #drawer.on{display:block}
  .panel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);overflow:auto;padding:24px;
    background:#0c0e18;border-left:1px solid var(--stroke-2)}
  .panel h2{margin:0 0 4px;font-size:18px}
  .panel .close{float:right;cursor:pointer;color:var(--muted);font-size:20px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
  .kv div{background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:10px;padding:9px 11px}
  .kv .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kv .v{font-size:15px;font-weight:700;margin-top:2px;white-space:normal;word-break:break-word}
  .section-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
  /* replay */
  .replay{padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--stroke)}
  .rp-hud{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .rp-dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
  .rp-dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
  .rp-bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .rp-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .rp-reps{font-weight:800;font-size:18px;min-width:52px}
  .rp-scrub{width:100%;margin:6px 0}
  .rp-meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
  .labelbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .diag{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#b9c0d4;background:#0a0c14;border:1px solid var(--stroke);
    border-radius:10px;padding:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--muted)} .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
  <!-- sign in -->
  <div id="auth" class="glass">
    <h1>Beta Console</h1>
    <p>Owner sign-in required.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn" id="signinBtn">Sign in</button>
    <div class="err" id="authErr"></div>
  </div>

  <!-- dashboard -->
  <div class="wrap" id="dash" style="display:none">
    <header>
      <div class="brand"><span class="dot"></span> Vision Beta <span class="tag">Live Proof</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost sm" id="inviteBtn">Invites</button>
        <button class="btn ghost sm" id="exportBtn">Export</button>
        <button class="btn ghost sm" id="refreshBtn">Refresh</button>
        <button class="btn ghost sm" id="signoutBtn">Sign out</button>
      </div>
    </header>

    <div class="tiles" id="tiles"></div>

    <div class="controls">
      <select id="fExercise"><option value="">All exercises</option></select>
      <select id="fDevice"><option value="">All devices</option></select>
      <select id="fSort">
        <option value="recent">Newest first</option>
        <option value="failures">Failures first</option>
        <option value="confidence">Lowest confidence</option>
      </select>
      <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px">
        <input type="checkbox" id="fFail" style="width:auto" /> Only failures / flags</label>
      <div class="spacer"></div>
      <span class="muted" id="count" style="font-size:13px"></span>
    </div>

    <div class="glass tblwrap">
      <table>
        <thead><tr>
          <th>When</th><th>Exercise</th><th>Result</th><th>Detected</th><th>Conf</th>
          <th>FPS</th><th>Track loss</th><th>Device</th><th>Browser</th><th>Flag</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No sessions yet. Share a beta invite link to collect data.</div>
    </div>
  </div>

  <!-- session drawer -->
  <div id="drawer"><div class="panel" id="panel"></div></div>

  <script src="/js/supabase-config.js" onerror="void 0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.0" crossorigin="anonymous"></script>
  <script src="/js/beta/beta-console.js"></script>
</body>
</html>
