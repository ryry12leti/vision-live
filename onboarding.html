      e.preventDefault();
      const d=(k==='ArrowRight'||k==='ArrowDown')?1:-1;
      cardEls[(i+d+cardEls.length)%cardEls.length].focus();
    });
    if(!REDUCED_MOTION&&matchMedia('(hover:hover) and (pointer:fine)').matches){
      grid.addEventListener('pointermove',e=>{
        const card=e.target.closest('.sg-analyst-card');if(!card)return;
        const r=card.getBoundingClientRect();
        const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
        card.style.setProperty('--mx',(px*100)+'%');
        card.style.setProperty('--my',(py*100)+'%');
        card.style.setProperty('--ry',((px-.5)*5).toFixed(2)+'deg');
        card.style.setProperty('--rx',((.5-py)*4).toFixed(2)+'deg');
      });
      grid.addEventListener('pointerout',e=>{
        const card=e.target.closest('.sg-analyst-card');if(!card)return;
        card.style.setProperty('--ry','0deg');card.style.setProperty('--rx','0deg');
      });
    }
    /* ceremony: gold signal branches out from the core emblem toward each Analyst position
       (setTimeout, not rAF — layout is final here and timers fire even when frames don't) */
    if(!REDUCED_MOTION){
      setTimeout(()=>{
        try{
          const svg=screen.querySelector('.sg-branches');
          const core=screen.querySelector('.sg-core-emblem');
          const x0=core.offsetLeft+core.offsetWidth/2, y0=core.offsetTop+core.offsetHeight-8;
          svg.setAttribute('viewBox','0 0 '+constellation.offsetWidth+' '+constellation.offsetHeight);
          cardEls.forEach((card,i)=>{
            const x1=grid.offsetLeft+card.offsetLeft+card.offsetWidth/2;
            const y1=grid.offsetTop+card.offsetTop+34;
            const p=document.createElementNS('http://www.w3.org/2000/svg','path');
            p.setAttribute('d','M'+x0.toFixed(1)+' '+y0.toFixed(1)+' Q'+((x0+x1)/2).toFixed(1)+' '+(((y0+y1)/2)-20).toFixed(1)+' '+x1.toFixed(1)+' '+y1.toFixed(1));
            p.setAttribute('pathLength','1');
            p.style.animationDelay=((baseDelay-.13)+i*stepDelay)+'s';
            svg.appendChild(p);
          });
        }catch(err){}
      },0);
      /* small gold particle drift as each card materialises — one-shot, then removed */
      const pcount=small?2:4;
      cardEls.forEach((card,i)=>{
        setTimeout(()=>{
          try{
            for(let k=0;k<pcount;k++){
              const s=document.createElement('span');s.className='sg-drift';
              s.style.left=(grid.offsetLeft+card.offsetLeft+card.offsetWidth*(0.25+Math.random()*0.5))+'px';
              s.style.top=(grid.offsetTop+card.offsetTop+card.offsetHeight*(0.3+Math.random()*0.4))+'px';
              s.style.setProperty('--dx',((Math.random()-.5)*70)+'px');
              s.style.setProperty('--dy',(-(30+Math.random()*60))+'px');
              s.style.setProperty('--dur',(1.2+Math.random()*.8)+'s');
              constellation.appendChild(s);
              setTimeout(()=>{try{s.remove();}catch(e){}},2300);
            }
          }catch(err){}
        },(baseDelay+i*stepDelay)*1000);
      });
    }
    /* settle: heavy motion stops, the title lands, the field waits for the user's choice */
    setTimeout(()=>{
      grid.classList.add('is-settled');
      constellation.classList.add('settled');
      cardEls.forEach(c=>c.classList.remove('enter-trace'));
      applyState();
      screen.querySelector('.sg-cere-head').classList.add('show');
      dock.classList.add('show');
    },REDUCED_MOTION?60:(small?1350:1850));
    goalInput.addEventListener('input',()=>{
      secondaryGoal=goalInput.value;
      answers.secondaryGoal=secondaryGoal;
      answers.secondaryGoalText=secondaryGoal;
      answers.secondaryGoalAnalyst=selected;
      answers.onboardingFlowStage='secondary-selection';
      lockBtn.disabled=!selected||!isMeaningfulSecondaryGoal(secondaryGoal);
      goalError.classList.remove('show');
      saveFlowDraft('secondary-selection');
    });
    goalInput.addEventListener('blur',()=>{
      if(secondaryGoal.trim()&&!isMeaningfulSecondaryGoal(secondaryGoal))goalError.classList.add('show');
    });
    lockBtn.onclick=()=>{
      if(locking||!selected)return;
      if(!isMeaningfulSecondaryGoal(secondaryGoal)){
        goalError.classList.add('show');goalInput.focus();return;
      }
      locking=true;
      secondaryGoal=secondaryGoal.trim();
      answers.secondaryGoal=secondaryGoal;
      answers.secondaryGoalText=secondaryGoal;
      answers.secondaryGoalAnalyst=selected;
      answers.onboardingFlowStage='analyst-locked';
      const latest=saveAll();
      lockBtn.disabled=true;backLink.disabled=true;
      grid.classList.add('locking');dock.classList.add('quiet');
      const card=cardEls.find(c=>c.dataset.analyst===selected);
      runLockCeremony(card,()=>showAnalystsLocked(layer,latest,secondaryGoal,selected));
    };
    backLink.onclick=()=>{
      if(locking)return;
      answers.onboardingFlowStage='secondary-choice';
      const latest=saveFlowDraft('secondary-choice');
      secondarySwap(layer,secondaryChoiceHtml(),s=>wireSecondaryChoice(layer,s,latest));
    };
  });
}
/* lock ceremony: others fade back → selected brightens, border completes → compress →
   emblem lifts out and travels on a gold path toward the primary Analyst position */
function runLockCeremony(card,done){
  if(REDUCED_MOTION||!card){done();return;}
  card.classList.add('locking-flash');
  setTimeout(()=>{
    card.classList.add('locking');
    setTimeout(()=>flyEmblem(card,done),300);
  },380);
}
function flyEmblem(card,done){
  const icon=card.querySelector('.sg-analyst-icon');
  if(!icon){done();return;}
  const r=icon.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const dual=window.innerWidth>850;
  const dx=(dual?window.innerWidth*.33:window.innerWidth*.5)-cx;
  const dy=(window.innerHeight*(dual?.46:.4))-cy;
  const ghost=icon.cloneNode(true);ghost.className='sg-fly-emblem';
  ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
  const trace=document.createElement('span');trace.className='sg-fly-trace';
  const len=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
  trace.style.left=cx+'px';trace.style.top=cy+'px';trace.style.width=len+'px';
  trace.style.transform='rotate('+ang+'deg) scaleX(0)';
  document.body.appendChild(trace);document.body.appendChild(ghost);
  /* force layout so the transition animates from the start state, then launch on a timer
     (timers keep firing even when the browser withholds animation frames) */
  void ghost.offsetWidth;
  setTimeout(()=>{
    ghost.style.transform='translate('+dx+'px,'+dy+'px) scale(1.3)';
    ghost.classList.add('go');
    trace.style.transform='rotate('+ang+'deg) scaleX(1)';
    trace.classList.add('go');
  },20);
  setTimeout(()=>{try{ghost.remove();trace.remove();}catch(e){}done();},760);
}
function lockCardMarkup(kind,profile,goal,items){
  return '<section class="sg-lock-card '+kind+'"><div class="sg-lock-label">'+(kind==='primary'?'Primary Analyst':'Supporting Analyst')+'</div><div class="sg-lock-badge">▣ Locked</div><div class="sg-lock-main"><div class="sg-lock-emblem">'+profile.icon+'</div><div class="sg-lock-copy"><h3>'+esc(profile.label)+'</h3><p>Assigned to your '+(kind==='primary'?'primary':'secondary')+' goal</p></div></div><div class="sg-lock-goal">'+esc(goal||'Goal ready for execution.')+'</div><div class="sg-lock-owns">'+ownershipMarkup(items)+'</div></section>';
}
function showAnalystsLocked(layer,obj,secondaryGoal,secondaryName){
  const primaryName=primaryGoalAnalystOf(obj);
  if(!primaryName){closeSecondaryLayer(layer,askPrimaryAreaClarification);return;}
  const resolvedSecondary=canonicalAnalystName(secondaryName);
  const savedSecondaryGoal=resolvedSecondary?String(
    secondaryGoal||
    answers.secondaryGoal||
    answers.secondaryGoalText||
    (obj&&(obj.secondaryGoal||obj.secondaryGoalText))||
    ''
  ).trim():null;
  answers.secondaryGoal=savedSecondaryGoal;
  answers.secondaryGoalText=savedSecondaryGoal;
  answers.secondaryGoalAnalyst=resolvedSecondary;
  answers.onboardingFlowStage='analyst-locked';
  const latest=saveAll();
  const primary=analystProfile(primaryName);
  const secondary=resolvedSecondary?analystProfile(resolvedSecondary):null;
  const title=secondary?'Your Analyst Team is Ready':'Your Analyst is locked in';
  const sub=secondary?'Your Primary Analyst and Supporting Analyst now operate as one coordinated system. VISION will develop both goals without sacrificing one clear priority.':'Your Primary Analyst is confirmed. You can add a serious second goal later from the Analyst Network.';
  const cards=lockCardMarkup('primary',primary,A.goalText,secondary?OWN_PRIMARY:SINGLE_GOAL_OWNERSHIP)+(secondary?lockCardMarkup('secondary',secondary,savedSecondaryGoal||secondary.short,OWN_SECONDARY):'');
  const linkFx=secondary?'<span class="sg-lock-pulse" aria-hidden="true"></span><span class="sg-lock-link" aria-hidden="true"></span>':'';
  secondarySwap(layer,'<div class="sg-locked-title'+(secondary?' team':'')+'"><div class="sg-eyebrow">System confirmed</div><h2 class="sg-title">'+esc(title)+'</h2><p class="sg-sub">'+esc(sub)+'</p></div><div class="sg-lock-wrap">'+linkFx+'<div class="sg-lock-grid '+(secondary?'':'single')+'">'+cards+'</div></div><div class="sg-enter"><button class="sg-btn gold" id="sgEnter">Enter VISION →</button><div class="sg-save-status" id="sgSaveStatus"></div></div><div class="sg-final-note">✦ One clear Today’s Move will be prioritised'+(secondary?' across both goals':' for your primary goal')+'.</div>',screen=>{
    const btn=screen.querySelector('#sgEnter');
    btn.onclick=()=>finalizeAndEnter(btn,screen.querySelector('#sgSaveStatus'),'analyst.html');
  });
}

/* ── final save-and-enter: localStorage is the source of truth, the account save is
      awaited in backend mode (mirrors the production onboarding contract) ── */
const PUSH_INTENSITY={'Calm':0,'Direct':1,'Hard':2,'No mercy':3};
function apiPayload(obj){
  return Object.assign({},obj,{
    displayName:obj.name,
    primaryGoal:obj.goalText,
    targetDeadline:obj.timeline,goalDeadline:obj.timeline,achievementDeadline:obj.timeline,
    intensityIdx:(PUSH_INTENSITY[obj.pushStyle]!=null)?PUSH_INTENSITY[obj.pushStyle]:1,
    goalReason:obj.skillWhy||null,
    onboardingSummary:[obj.selectedRoute,obj.selectedCategory,obj.selectedSkill].filter(Boolean).join(' · ')||null,
    onboardingComplete:true,
    age:null,   /* age buckets are display strings; keep them local-only so numeric DB columns stay clean */
    answers:Object.assign({},answers)
  });
}
async function finalizeAndEnter(btn,statusEl,href){
  const obj=saveAll();
  let live=false;
  try{live=!!(window.VISION&&VISION.backend&&VISION.api&&VISION.api.saveOnboarding&&VISION.auth&&await VISION.auth.isAuthed());}catch(e){}
  if(live){
    btn.disabled=true;
    if(statusEl){statusEl.classList.remove('bad');statusEl.textContent='Saving your system to your account…';}
    let r=null;try{r=await VISION.api.saveOnboarding(apiPayload(obj));}catch(e){r={error:String(e)};}
    if(!r||r.error){
      try{VISION.analytics.track('onboarding_save_failed');}catch(e){}
      if(statusEl){statusEl.textContent='Could not save — check your connection. Your answers are kept.';statusEl.classList.add('bad');}
      btn.disabled=false;btn.textContent='Retry →';return;
    }
    if(statusEl)statusEl.textContent='';
  }
  clearFlowResume();
  window.location.href=href;
}

function chooseSystem(choice){
  const primary=primaryGoalAnalystOf();
  if(!primary){askPrimaryAreaClarification();return;}
  answers.primaryGoalAnalyst=primary;answers.mainAnalyst=primary;
  answers.systemChoice=choice;answers.hasAnalyst=(choice==='analyst');
  document.querySelectorAll('.ch-card').forEach(c=>c.classList.add('locked'));
  const chosen=document.querySelector(choice==='analyst'?'#chSmart':'#chBasic');
  if(chosen){chosen.classList.remove('locked');chosen.classList.add('chosen');}
  backBtn.classList.remove('show');
  answers.onboardingFlowStage=(choice==='analyst')?'analyst-reveal':'basic-confirmation';
  const obj=saveAll();
  if(choice==='analyst')revealGoalAnalyst(primaryGoalAnalystOf(obj),continueAfterGoalAnalyst);
  else finalEntry(choice,obj);
}
function continueAfterGoalAnalyst(){
  answers.onboardingFlowStage='secondary-choice';
  const obj=saveAll();
  showSecondaryGoalChoice(obj);
}
function finalEntry(choice,obj){
  const cfg=ENTRY[choice]||ENTRY.analyst;
  if(choice==='basic'){
    say("Your goal is ready.",()=>say(cfg.l3,()=>{
      showEntryCard(cfg,obj);
      showEntryCta(cfg);
    }));
    return;
  }
  say("Route built.",()=>say("Your proof system is ready.",()=>say(cfg.l3,()=>{
    showEntryCard(cfg,obj);
    showEntryCta(cfg);
  })));
}
/* one premium black-glass card — no table, no report */
function showEntryCard(cfg,obj){
  const detailVal=(cfg.href==='analyst.html')?primaryGoalAnalystOf(obj):'Basic plan';
  const d=document.createElement('div');d.className='introcard';d.style.maxWidth='480px';
  d.innerHTML=
     '<div style="font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);opacity:.9">Signal collected</div>'
    +'<div style="margin-top:12px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:2.1rem;line-height:1.04;color:var(--champagne);text-shadow:0 0 36px rgba(230,196,106,.45)">'+esc(cfg.title)+'</div>'
    +'<div style="margin-top:11px;font-size:.92rem;font-weight:300;color:var(--mute);line-height:1.5">Your goal, route, and deadline have been locked.</div>'
    +'<div style="display:flex;justify-content:space-between;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(230,196,106,.2)">'
      +'<span style="font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);align-self:center">'+esc(cfg.detailLabel)+'</span>'
      +'<span style="font-size:.96rem;color:var(--gold);font-weight:500;text-align:right;text-shadow:0 0 18px rgba(230,196,106,.3)">'+esc(detailVal)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;gap:14px;margin-top:12px;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)">'
      +'<span style="font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);align-self:center">Goal</span>'
      +'<span style="font-size:.96rem;color:var(--champagne);font-weight:400;text-align:right">'+esc(A.goalText)+'</span></div>';
  log.appendChild(d);scroll();
}
function showEntryCta(cfg){
  clearDock();ctaWrap.classList.remove('hidden');ctaBtn.classList.remove('hidden');
  ctaBtn.textContent=cfg.cta;
  saveStatus.classList.remove('bad');saveStatus.textContent='';
  ctaBtn.onclick=()=>finalizeAndEnter(ctaBtn,saveStatus,cfg.href);
  scroll();
}

/* ── save (localStorage is the source of truth + best-effort VISION pipeline) ── */
function buildFinalObject(){
  const primaryGoalAnalyst=canonicalAnalystName(answers.primaryGoalAnalyst)||
    canonicalAnalystName(answers.mainAnalyst)||
    resolveAnalyst();
  const secondaryGoalAnalyst=canonicalAnalystName(answers.secondaryGoalAnalyst);
  const secondaryGoal=secondaryGoalAnalyst?String(
    answers.secondaryGoal||answers.secondaryGoalText||''
  ).trim()||null:null;
  return {
    name:A.name,
    age:answers.age||null,
    goalText:A.goalText,
    goalDetail:answers.goalDetail||A.goalText,
    selectedRoute:answers.selectedRoute||null,
    selectedCategory:answers.selectedCategory||null,
    selectedSkill:answers.selectedSkill||null,
    skillLabel:answers.skillLabel||null,
    skillWhy:answers.skillWhy||null,
    timeline:answers.timeline||null,
    weakness:answers.weakness||null,
    proofStyle:answers.proofStyle||null,
    pushStyle:answers.pushStyle||null,
    mainAnalyst:primaryGoalAnalyst, // legacy saved-state alias
    primaryGoalAnalyst:primaryGoalAnalyst,
    secondaryGoal:secondaryGoal,
    secondaryGoalText:secondaryGoal, // legacy saved-state alias
    secondaryGoalAnalyst:secondaryGoalAnalyst,
    systemChoice:answers.systemChoice||null,
    hasAnalyst:answers.hasAnalyst===true,
    onboardingFlowStage:answers.onboardingFlowStage||null,
    answers:Object.assign({},answers,{
      mainAnalyst:primaryGoalAnalyst,
      primaryGoalAnalyst:primaryGoalAnalyst,
      secondaryGoal:secondaryGoal,
      secondaryGoalText:secondaryGoal,
      secondaryGoalAnalyst:secondaryGoalAnalyst
    }),
    createdAt:new Date().toISOString()
  };
}
function persistLocalObject(obj){
  try{
    localStorage.setItem('vision_goal',obj.goalText||'');
    localStorage.setItem('onboardingGoal',obj.goalText||'');
    localStorage.setItem('userGoal',obj.goalText||'');
    localStorage.setItem('vision_main_goal',obj.goalText||'');
    localStorage.setItem('vision_system_choice',obj.systemChoice||'');
    localStorage.setItem('vision_has_analyst',obj.hasAnalyst?'true':'false');
    localStorage.setItem('vision_primary_goal_analyst',obj.primaryGoalAnalyst||'');
    localStorage.setItem('vision_secondary_goal',obj.secondaryGoal||obj.secondaryGoalText||'');
    localStorage.setItem('vision_secondary_goal_analyst',obj.secondaryGoalAnalyst||'');
    localStorage.setItem('vision_onboarding',JSON.stringify(obj));
    if(obj.onboardingFlowStage)localStorage.setItem(FLOW_STAGE_KEY,obj.onboardingFlowStage);
    else localStorage.removeItem(FLOW_STAGE_KEY);
  }catch(e){}
}
function saveFlowDraft(stage){
  if(stage!==undefined)answers.onboardingFlowStage=stage;
  const obj=buildFinalObject();
  persistLocalObject(obj);
  return obj;
}
function saveAll(){
  const obj=buildFinalObject();
  persistLocalObject(obj);
  /* best-effort: keep the existing VISION pipeline + analytics working when present */
  try{ if(window.VISION&&VISION.core&&VISION.core.saveOnboarding){
    VISION.core.saveOnboarding(Object.assign({
      name:obj.name,displayName:obj.name,age:obj.age,
      primaryGoal:obj.goalText,goalText:obj.goalText,onboardingComplete:true
    },obj));
  }}catch(e){}
  try{ if(window.VISION&&VISION.analytics&&VISION.analytics.track){VISION.analytics.track('onboarding_complete');} }catch(e){}
  return obj;
}

function primaryGoalAnalystOf(obj){
  return canonicalAnalystName(obj&&obj.primaryGoalAnalyst)||
    canonicalAnalystName(answers.primaryGoalAnalyst)||
    canonicalAnalystName(obj&&obj.mainAnalyst)||
    canonicalAnalystName(answers.mainAnalyst)||
    resolveAnalyst();
}
function resumeSavedFlow(){
  let stage='',obj=null;
  try{
    stage=localStorage.getItem(FLOW_STAGE_KEY)||'';
    obj=JSON.parse(localStorage.getItem('vision_onboarding')||'null');
  }catch(e){}
  if(!stage)return false;
  if(!obj||typeof obj!=='object'||!obj.goalText){
    clearFlowResume();return false;
  }
  const valid=['primary-clarification','plan-choice','analyst-reveal','secondary-choice','secondary-selection','analyst-locked','basic-confirmation'];
  if(valid.indexOf(stage)<0){
    clearFlowResume();return false;
  }
  hydrateSavedFlow(obj,stage);
  phase='summary';refreshProgress();clearDock();backBtn.classList.remove('show');
  const primary=primaryGoalAnalystOf(obj);
  if(!primary){
    answers.systemChoice=null;answers.hasAnalyst=false;
    askPrimaryAreaClarification();return true;
  }
  answers.primaryGoalAnalyst=primary;answers.mainAnalyst=primary;
  if(stage==='primary-clarification'){
    askPrimaryAreaClarification();return true;
  }
  if(stage==='plan-choice'){
    saveFlowDraft('plan-choice');showChoiceBox();return true;
  }
  if(stage==='analyst-reveal'&&obj.systemChoice==='analyst'){
    revealGoalAnalyst(primaryGoalAnalystOf(obj),continueAfterGoalAnalyst);return true;
  }
  if(stage==='secondary-choice'&&obj.systemChoice==='analyst'){
    showSecondaryGoalChoice(obj);return true;
  }
  if(stage==='secondary-selection'&&obj.systemChoice==='analyst'){
    const layer=createSecondaryLayer();showSecondaryAnalystSelection(layer,obj);return true;
  }
  if(stage==='analyst-locked'&&obj.systemChoice==='analyst'){
    const layer=createSecondaryLayer();showAnalystsLocked(layer,obj,obj.secondaryGoal||obj.secondaryGoalText,obj.secondaryGoalAnalyst);return true;
  }
  if(stage==='basic-confirmation'&&obj.systemChoice==='basic'){
    finalEntry('basic',obj);return true;
  }
  clearFlowResume();return false;
}

/* ── back ── */
function back(){
  if(typingEl)return;
  const last=history.pop();if(!last)return;
  while(log.children.length>last.anchor&&log.lastElementChild){log.lastElementChild.remove();}
  if(last.undo)last.undo();
  if(last.rerender)last.rerender();
  refreshProgress();
}
backBtn.onclick=back;

start();
})();
</script>

<script>
/* ambient starfield (decorative, dependency-free) */
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('stars');if(!c)return;const x=c.getContext('2d');let w,h,st=[];
  function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}rs();addEventListener('resize',rs);
  const N=Math.min(90,Math.floor(innerWidth/18));
  for(let i=0;i<N;i++)st.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1+.25,vx:(Math.random()-.5)*.04,vy:(Math.random()-.5)*.04,a:Math.random()*.18+.04,tw:Math.random()*6.28});
  (function d(){x.clearRect(0,0,w,h);for(const s of st){s.x+=s.vx;s.y+=s.vy;s.tw+=.011;if(s.x<0)s.x=w;if(s.x>w)s.x=0;if(s.y<0)s.y=h;if(s.y>h)s.y=0;const a=s.a*(.6+.4*Math.sin(s.tw));x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fillStyle='rgba(235,216,176,'+a+')';x.fill();}requestAnimationFrame(d);})();
})();
</script>
