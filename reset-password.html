<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.auth-wrap{min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 22px;gap:20px}
.auth-card{width:100%;max-width:404px;padding:34px 30px}
.auth-logo{display:block;text-align:center;font-size:1.05rem;letter-spacing:.42em;color:var(--text);text-decoration:none;margin-bottom:20px;padding-left:.42em}
.auth-h{font-size:clamp(1.55rem,5vw,2.05rem);font-weight:100;letter-spacing:-.03em;text-align:center;margin:4px 0 8px}
.auth-h em{font-family:var(--serif);font-style:italic;color:var(--gold)}
.auth-sub{text-align:center;font-size:.76rem;color:var(--mute);margin-bottom:22px}
.auth-card .field{width:100%}
.auth-err{display:none;color:var(--rose);font-size:.72rem;margin-top:14px;letter-spacing:.01em}
.auth-err.show{display:block}
.auth-note{display:none;color:var(--emerald);font-size:.74rem;margin-top:16px;text-align:center;line-height:1.5}
.auth-note.show{display:block}
.auth-alt{text-align:center;font-size:.74rem;color:var(--mute);margin-top:20px}
.auth-alt a{color:var(--gold);text-decoration:none}
.auth-back{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-decoration:none}
.pw-wrap{position:relative}
.pw-wrap .field{padding-right:62px}
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:6px}
.pw-eye:hover{color:var(--mute)}
.pw-hint{font-size:.66rem;color:var(--dim);margin-top:6px;letter-spacing:.02em}
.iab-warn{display:none;font-size:.7rem;color:var(--gold);border:1px solid rgba(212,180,131,.35);border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.5}
.iab-warn.show{display:block}
.newlink{display:none;width:100%;margin-top:14px;text-align:center}
.newlink.show{display:inline-flex;justify-content:center}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="amb"></div>
<div id="fog"></div>
<div class="rays"><span></span><span></span></div>
<div class="grain"></div>

<main class="auth-wrap">
  <div class="auth-card card liquid reveal">
    <a href="index.html" class="auth-logo">VISION</a>
    <div class="kicker" style="text-align:center">Account recovery</div>
    <h1 class="auth-h">Set a new <em>password.</em></h1>
    <div class="auth-sub" id="sub">Checking your reset link…</div>
    <div class="iab-warn" id="iabWarn">Opened inside an app&rsquo;s built-in browser? Reset links can fail there.
      If the link doesn&rsquo;t work, copy it and open it in Safari or Chrome instead.</div>
    <form id="form" novalidate>
      <label class="flabel">New password</label>
      <div class="pw-wrap">
        <input class="field" type="password" id="password" autocomplete="new-password" placeholder="••••••••" required>
        <button type="button" class="pw-eye" id="pwEye" aria-label="Show password">Show</button>
      </div>
      <div class="pw-hint">At least 6 characters.</div>
      <label class="flabel" style="margin-top:14px">Confirm new password</label>
      <div class="pw-wrap">
        <input class="field" type="password" id="confirm" autocomplete="new-password" placeholder="••••••••" required>
        <button type="button" class="pw-eye" id="pwEye2" aria-label="Show password">Show</button>
      </div>
      <div class="auth-err" id="err"></div>
      <button class="btn btn-gold" type="submit" id="submit" style="width:100%;margin-top:18px">Update password <span class="arr">→</span></button>
    </form>
    <a href="forgot-password.html" class="btn btn-ghost newlink" id="newLink">Send me a new link</a>
    <div class="auth-note" id="note"></div>
    <div class="auth-alt"><a href="login.html">← Back to log in</a></div>
  </div>
  <a href="index.html" class="auth-back">← Back to landing</a>
</main>

<script src="js/boot-guard.js"></script>
<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.0"></script>
<script src="js/supabase.js"></script>
<script src="js/analytics.js"></script>
<script src="js/auth.js"></script>
<script src="js/app-ui.js"></script>
<script>
(function(){
  const A=VISION.auth;
  const $=function(id){return document.getElementById(id);};
  const err=$('err'), note=$('note');
  function showErr(m){ err.textContent=m; err.classList.add('show'); note.classList.remove('show'); }
  try{VISION.analytics.track('password_reset_view');}catch(e){}

  // password show/hide toggles
  function eye(btnId, inputId){
    $(btnId).addEventListener('click', function(){
      const p=$(inputId), show=p.type==='password';
      p.type=show?'text':'password';
      this.textContent=show?'Hide':'Show';
      this.setAttribute('aria-label', show?'Hide password':'Show password');
    });
  }
  eye('pwEye','password'); eye('pwEye2','confirm');

  // In-app browsers (Instagram, Facebook, TikTok, Android WebView…) often
  // break auth links — warn early so the user knows why and what to do.
  if(/(FBAN|FBAV|Instagram|Line|TikTok|Twitter|GSA|wv\))/i.test(navigator.userAgent)){
    $('iabWarn').classList.add('show');
  }

  // The recovery link signs the user in with a temporary session
  // (detectSessionInUrl handles the URL hash). Without that session,
  // updating the password is impossible — explain and offer a fresh link.
  // Use a timeout so the page never hangs perpetually on mobile.
  var pwTimeout = setTimeout(function(){
    $('sub').textContent='Could not verify your reset link.';
    showErr('The recovery session timed out. This can happen on slow connections or if the link was opened in an in-app browser. Request a fresh reset link and open it in Safari or Chrome instead.');
    $('submit').disabled=true;
    $('newLink').classList.add('show');
  }, 8000);
  (async function(){
    try {
      if(!VISION.backend){ clearTimeout(pwTimeout); showErr('Password reset requires backend setup.'); return; }
      // give the SDK a moment to consume the recovery hash
      await new Promise(function(res){ setTimeout(res, 400); });
      const s=await A.getSession();
      if(!s){
        clearTimeout(pwTimeout);
        $('sub').textContent='This reset link is invalid or has expired.';
        showErr('Reset links only work once and expire quickly. Request a fresh one below.');
        $('submit').disabled=true;
        $('newLink').classList.add('show');
        return;
      }
      clearTimeout(pwTimeout);
      $('sub').textContent='Choose a new password for your account.';
    } catch(e) {
      clearTimeout(pwTimeout);
      $('sub').textContent='Something went wrong.';
      showErr('Could not verify your reset link. Try requesting a new one and open it in Safari or Chrome.');
      $('submit').disabled=true;
      $('newLink').classList.add('show');
    }
  })();

  $('form').addEventListener('submit', async function(e){
    e.preventDefault(); err.classList.remove('show'); note.classList.remove('show');
    const btn=$('submit');
    const password=$('password').value, confirm=$('confirm').value;
    if(password.length<6){ showErr('Password must be at least 6 characters.'); return; }
    if(password!==confirm){ showErr('Passwords do not match.'); return; }
    btn.disabled=true;
    const r=await A.updatePassword(password);
    if(r.error){ showErr(r.error.message||'Could not update password. Try again.'); btn.disabled=false; return; }
    try{VISION.analytics.track('password_reset_success');}catch(e2){}
    note.textContent='Password updated. Taking you to log in…';
    note.classList.add('show');
    // end the temporary recovery session and have the user log in fresh
    // with the new password — proves the reset actually worked
    setTimeout(async function(){
      try{ await A.signOut(); }catch(e3){}
      location.replace('login.html?reset=success');
    }, 900);
  });
})();
</script>
</body>
</html>
